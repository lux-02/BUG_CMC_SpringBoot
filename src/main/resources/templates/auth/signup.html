<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 게시판</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-light: #f9fafb;
            --border-color: #e5e7eb;
        }

        body {
            background-color: var(--bg-light);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }

        .signup-card {
            max-width: 480px;
            width: 100%;
            padding: 3rem 2.5rem;
            background: white;
            border-radius: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }

        .signup-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .brand-logo {
            width: 64px;
            height: 64px;
            background: #eef2ff;
            color: var(--primary-color);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-bottom: 1.5rem;
        }

        .signup-header h1 {
            font-size: 1.85rem;
            font-weight: 800;
            color: #111827;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
        }

        .signup-header p {
            color: #6b7280;
            font-size: 0.95rem;
        }

        .form-label {
            font-weight: 600;
            color: #374151;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.025em;
            margin-bottom: 0.5rem;
        }

        .form-control, .form-select {
            padding: 0.75rem 1rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background-color: #f9fafb;
            transition: all 0.2s;
        }

        .form-control:focus, .form-select:focus {
            background-color: white;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .btn-signup {
            background-color: var(--primary-color);
            border: none;
            padding: 0.85rem;
            font-weight: 700;
            border-radius: 12px;
            transition: all 0.2s;
            margin-top: 1rem;
        }

        .btn-signup:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }

        .divider {
            text-align: center;
            margin: 2rem 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: var(--border-color);
        }

        .divider span {
            background: white;
            padding: 0 1rem;
            position: relative;
            color: #9ca3af;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .login-link {
            color: var(--primary-color);
            font-weight: 700;
            text-decoration: none;
            transition: color 0.2s;
        }

        .login-link:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="signup-card">
        <div class="signup-header">
            <div class="brand-logo">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <h1>Create Account</h1>
            <p>BOARD.IO와 함께 새로운 여정을 시작하세요</p>
        </div>

        <!-- 에러 메시지 -->
        <div th:if="${error}" class="alert alert-danger border-0 small mb-4" role="alert" style="border-radius: 12px; background-color: #fef2f2; color: #991b1b;">
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span th:text="${error}"></span>
            </div>
        </div>

        <!-- 회원가입 폼 -->
        <form th:action="@{/users/signup}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" required
                       th:value="${email}"
                       placeholder="name@company.com">
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required
                           minlength="4"
                           placeholder="••••••••">
                </div>
                <div class="col-md-6">
                    <label for="passwordConfirm" class="form-label">Confirm</label>
                    <input type="password" class="form-control" id="passwordConfirm" name="passwordConfirm" required
                           minlength="4"
                           placeholder="••••••••">
                </div>
                <div class="form-text mt-2 small">최소 4자 이상의 비밀번호를 입력하세요.</div>
            </div>

            <div class="mb-4">
                <label for="role" class="form-label">Account Type</label>
                <select class="form-select" id="role" name="role" required>
                    <option value="USER">일반 사용자 (USER)</option>
                    <option value="ADMIN">관리자 (ADMIN)</option>
                </select>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-signup text-white">
                    Create BOARD.IO account
                </button>
            </div>
        </form>

        <div class="divider">
            <span>Already have an account?</span>
        </div>

        <div class="text-center">
            <p class="mb-0 text-muted small">
                이미 계정이 있으신가요?
                <a href="/login" class="login-link">로그인 하기</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 비밀번호 일치 확인
        document.querySelector('form').addEventListener('submit', function(e) {
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;

            if (password !== passwordConfirm) {
                e.preventDefault();
                alert('비밀번호가 일치하지 않습니다.');
                return false;
            }
        });
    </script>
</body>
</html>
