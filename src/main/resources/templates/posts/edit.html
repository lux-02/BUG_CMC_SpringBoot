<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글 수정 - 게시판</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
    <!-- 네비게이션 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/web/posts">
                <i class="bi bi-journal-text"></i> 게시판
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <span class="navbar-text text-light me-3">
                            <i class="bi bi-person-circle"></i>
                            <span sec:authentication="name"></span>님
                        </span>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" href="/web/bookmarks">
                            <i class="bi bi-star-fill text-warning"></i> 내 북마크
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" href="/web/categories">
                            <i class="bi bi-folder-fill"></i> 카테고리 관리
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-danger btn-sm ms-2">
                                <i class="bi bi-box-arrow-right"></i> 로그아웃
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 메인 컨텐츠 -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-warning text-dark">
                        <h4 class="mb-0">
                            <i class="bi bi-pencil"></i> 게시글 수정
                        </h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/web/posts/{id}/edit(id=${post.id})}" method="post">
                            <!-- 카테고리 정보 (읽기 전용) -->
                            <div class="mb-4">
                                <label class="form-label">
                                    <i class="bi bi-folder"></i> 카테고리
                                </label>
                                <input type="text" class="form-control" th:value="${post.category.name}" disabled>
                                <div class="form-text text-muted">
                                    <i class="bi bi-info-circle"></i> 카테고리는 수정할 수 없습니다.
                                </div>
                            </div>

                            <!-- 제목 입력 -->
                            <div class="mb-4">
                                <label for="title" class="form-label">
                                    <i class="bi bi-card-heading"></i> 제목 <span class="text-danger">*</span>
                                </label>
                                <input type="text" class="form-control form-control-lg" id="title" name="title"
                                       th:value="${post.title}"
                                       placeholder="게시글 제목을 입력하세요" required maxlength="200">
                                <div class="form-text">최대 200자까지 입력 가능합니다.</div>
                            </div>

                            <!-- 내용 입력 -->
                            <div class="mb-4">
                                <label for="content" class="form-label">
                                    <i class="bi bi-textarea-t"></i> 내용 <span class="text-danger">*</span>
                                </label>
                                <textarea class="form-control" id="content" name="content" rows="12"
                                          placeholder="게시글 내용을 입력하세요" required
                                          th:text="${post.content}"></textarea>
                            </div>

                            <!-- 버튼 -->
                            <div class="d-flex gap-2 justify-content-end">
                                <a th:href="@{/web/posts/{id}(id=${post.id})}" class="btn btn-lg btn-secondary">
                                    <i class="bi bi-x-circle"></i> 취소
                                </a>
                                <button type="submit" class="btn btn-lg btn-warning">
                                    <i class="bi bi-check-circle"></i> 수정하기
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- 작성 정보 -->
                <div class="alert alert-secondary mt-4">
                    <h6 class="alert-heading">
                        <i class="bi bi-info-circle"></i> 게시글 정보
                    </h6>
                    <ul class="mb-0 small">
                        <li>작성자: <strong th:text="${post.user.email}">작성자</strong></li>
                        <li th:if="${post.createdAt != null}">
                            작성일: <strong th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</strong>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <!-- 푸터 -->
    <footer class="bg-light text-center text-muted py-4 mt-5">
        <div class="container">
            <p class="mb-0">
                <i class="bi bi-code-square"></i>
                &copy; 2025 Spring Boot 게시판 프로젝트. All rights reserved.
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
