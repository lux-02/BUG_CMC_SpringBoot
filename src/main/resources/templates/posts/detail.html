<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${post.title} + ' - 게시판'">게시글 상세</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #f9fafb;
      }

      .post-card {
        border: none;
        border-radius: 20px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05),
          0 2px 4px -1px rgba(0, 0, 0, 0.06);
        background: white;
      }

      .post-header {
        padding: 3rem 2rem;
        background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        color: white;
        border-radius: 20px 20px 0 0;
      }

      .post-category {
        background: rgba(255, 255, 255, 0.2);
        color: white;
        padding: 0.5rem 1rem;
        border-radius: 50px;
        font-size: 0.85rem;
        font-weight: 600;
        backdrop-filter: blur(4px);
      }

      .post-title {
        font-size: 2.5rem;
        font-weight: 800;
        line-height: 1.2;
        margin: 1.5rem 0;
        letter-spacing: -0.025em;
      }

      .post-content {
        padding: 3rem 2rem;
        font-size: 1.15rem;
        color: #374151;
        line-height: 1.8;
        white-space: pre-wrap;
        word-wrap: break-word;
      }

      .comment-section {
        background: #ffffff;
        border-radius: 20px;
        padding: 2.5rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      }

      .comment-item {
        border-bottom: 1px solid #f3f4f6;
        padding: 1.5rem 1rem; /* 좌우 여백 추가 */
        transition: all 0.2s;
      }

      .comment-item:last-child {
        border-bottom: none;
      }

      .comment-item.reply {
        padding-left: 3rem;
        padding-right: 1rem; /* 대댓글 우측 여백 추가 */
        background-color: #f9fafb;
        border-radius: 12px;
        margin-top: 0.5rem;
        border-bottom: none;
      }

      /* 아이콘 버튼 전용 스타일 */
      .btn-icon-sm {
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        transition: all 0.2s;
        color: #9ca3af !important; /* 기본 회색 */
      }

      .btn-icon-sm:hover {
        background-color: #f3f4f6;
        color: #4b5563 !important; /* 호버 시 진한 회색 */
        transform: translateY(-1px);
      }

      .btn-icon-sm.text-danger:hover {
        background-color: #fee2e2;
        color: #dc2626 !important;
      }

      .user-avatar {
        width: 40px;
        height: 40px;
        background: #eef2ff;
        color: #4f46e5;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
      }

      .btn-action {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        background: white;
        border: 1px solid #e5e7eb;
        color: #6b7280;
      }

      .btn-action:hover {
        background: #f3f4f6;
        color: #111827;
        transform: translateY(-2px);
      }

      .btn-bookmark.active {
        background: #fef3c7;
        border-color: #fbbf24;
        color: #d97706;
      }

      .comment-form textarea {
        border-radius: 12px;
        border: 1px solid #e5e7eb;
        padding: 1rem;
        transition: all 0.2s;
      }

      .comment-form textarea:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
      }
    </style>
  </head>
  <body>
    <!-- 네비게이션 바 -->
    <nav
      class="navbar navbar-expand-lg navbar-dark shadow-sm sticky-top"
      style="background-color: #1f2937 !important"
    >
      <div class="container">
        <a
          class="navbar-brand d-flex align-items-center gap-2"
          href="/web/posts"
        >
          <i class="bi bi-intersect fs-3 text-primary"></i>
          <span class="fw-bold text-white">BOARD.IO</span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-center gap-2">
            <li class="nav-item" sec:authorize="isAuthenticated()">
              <div class="d-flex align-items-center text-white-50 me-2">
                <i class="bi bi-person-circle fs-5 me-2"></i>
                <span
                  sec:authentication="name"
                  class="small fw-medium text-white"
                ></span
                >님
              </div>
            </li>

            <li class="nav-item" sec:authorize="isAuthenticated()">
              <a
                class="nav-link d-flex align-items-center gap-1 px-3"
                href="/web/bookmarks"
              >
                <i class="bi bi-star-fill text-warning"></i>
                <span>내 북마크</span>
              </a>
            </li>

            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
              <a
                class="nav-link d-flex align-items-center gap-1 px-3"
                href="/web/categories"
              >
                <i class="bi bi-gear-fill"></i>
                <span>설정</span>
              </a>
            </li>

            <li class="nav-item ms-lg-2" sec:authorize="isAuthenticated()">
              <form th:action="@{/logout}" method="post" class="d-inline">
                <button
                  type="submit"
                  class="btn btn-outline-danger btn-sm d-flex align-items-center gap-1 px-3"
                >
                  <i class="bi bi-box-arrow-right"></i>
                  <span>로그아웃</span>
                </button>
              </form>
            </li>

            <li class="nav-item" sec:authorize="isAnonymous()">
              <a class="btn btn-primary btn-sm px-4 fw-bold" href="/login"
                >시작하기</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- 메인 컨텐츠 -->
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-9">
          <!-- 게시글 카드 -->
          <div class="card post-card mb-5">
            <div class="post-header">
              <div
                class="d-flex align-items-center justify-content-between mb-4"
              >
                <span
                  class="post-category"
                  th:text="${post.category.name}"
                ></span>
                <div class="d-flex gap-2">
                  <!-- 북마크 버튼 -->
                  <form
                    th:if="${currentUser != null}"
                    th:action="@{/web/posts/{id}/bookmark(id=${post.id})}"
                    method="post"
                  >
                    <button
                      type="submit"
                      class="btn-action btn-bookmark"
                      th:classappend="${isBookmarked} ? 'active' : ''"
                    >
                      <i
                        class="bi"
                        th:classappend="${isBookmarked} ? 'bi-star-fill' : 'bi-star'"
                      ></i>
                    </button>
                  </form>

                  <!-- 수정 버튼 -->
                  <a
                    th:if="${currentUser != null and currentUser.id == post.user.id}"
                    th:href="@{/web/posts/{id}/edit(id=${post.id})}"
                    class="btn-action"
                  >
                    <i class="bi bi-pencil-square"></i>
                  </a>

                  <!-- 삭제 버튼 -->
                  <form
                    th:if="${currentUser != null and currentUser.id == post.user.id}"
                    th:action="@{/web/posts/{id}/delete(id=${post.id})}"
                    method="post"
                    onsubmit="return confirm('정말 삭제하시겠습니까?');"
                  >
                    <button type="submit" class="btn-action text-danger">
                      <i class="bi bi-trash3"></i>
                    </button>
                  </form>
                </div>
              </div>

              <h1 class="post-title" th:text="${post.title}"></h1>

              <div class="d-flex align-items-center gap-3">
                <div
                  class="user-avatar"
                  th:text="${#strings.substring(post.user.email, 0, 1).toUpperCase()}"
                ></div>
                <div>
                  <div class="fw-bold" th:text="${post.user.email}"></div>
                  <div
                    class="small opacity-75"
                    th:text="${#temporals.format(post.createdAt, 'yyyy년 MM월 dd일 HH:mm')}"
                  ></div>
                </div>
              </div>
            </div>

            <div class="post-content" th:text="${post.content}"></div>
          </div>

          <!-- 댓글 섹션 -->
          <div class="comment-section">
            <h4 class="fw-bold mb-4">
              Discussion
              <span class="text-primary" th:text="${comments.size()}">0</span>
            </h4>

            <!-- 댓글 작성 폼 -->
            <div sec:authorize="isAuthenticated()" class="mb-5">
              <form
                th:action="@{/web/posts/{id}/comments(id=${post.id})}"
                method="post"
                class="comment-form"
              >
                <div class="mb-3">
                  <textarea
                    name="content"
                    class="form-control"
                    rows="3"
                    placeholder="이 글에 대한 생각을 나누어보세요..."
                    required
                  ></textarea>
                </div>
                <div class="text-end">
                  <button type="submit" class="btn btn-primary px-4">
                    <i class="bi bi-chat-fill me-2"></i> 댓글 등록
                  </button>
                </div>
              </form>
            </div>

            <div
              sec:authorize="isAnonymous()"
              class="alert alert-light border text-center py-4 mb-5"
            >
              <p class="text-muted mb-3">로그인하고 대화에 참여해보세요.</p>
              <a href="/login" class="btn btn-primary px-4">로그인하기</a>
            </div>

            <!-- 댓글 목록 -->
            <div
              th:if="${comments.isEmpty()}"
              class="text-center py-5 text-muted"
            >
              <i class="bi bi-chat-quote fs-1 opacity-25"></i>
              <p class="mt-3">아직 작성된 댓글이 없습니다.</p>
            </div>

            <div
              th:each="comment : ${comments}"
              class="comment-item"
              th:classappend="${comment.parent != null} ? 'reply' : ''"
            >
              <div class="d-flex gap-3">
                <div
                  class="user-avatar sm"
                  style="width: 32px; height: 32px; font-size: 0.8rem"
                  th:text="${#strings.substring(comment.user.email, 0, 1).toUpperCase()}"
                ></div>
                <div class="flex-grow-1">
                  <div
                    class="d-flex justify-content-between align-items-center mb-2"
                  >
                    <div>
                      <span
                        class="fw-bold small"
                        th:text="${comment.user.email}"
                      ></span>
                      <span
                        class="text-muted small ms-2"
                        th:text="${#temporals.format(comment.createdAt, 'MM.dd HH:mm')}"
                      ></span>
                    </div>
                    <div class="d-flex gap-1">
                      <button
                        th:if="${comment.parent == null}"
                        class="btn btn-link btn-icon-sm text-decoration-none p-0"
                        th:onclick="'toggleReplyForm(' + ${comment.id} + ')'"
                        title="답글 달기"
                      >
                        <i class="bi bi-chat-dots fs-6"></i>
                      </button>
                      <form
                        th:if="${currentUser != null and currentUser.id == comment.user.id}"
                        th:action="@{/web/comments/{id}/delete(id=${comment.id})}"
                        method="post"
                        onsubmit="return confirm('댓글을 삭제하시겠습니까?');"
                        class="d-inline"
                      >
                        <button
                          type="submit"
                          class="btn btn-link btn-icon-sm text-decoration-none p-0"
                          title="삭제하기"
                        >
                          <i class="bi bi-trash3 fs-6"></i>
                        </button>
                      </form>
                    </div>
                  </div>

                  <div
                    class="comment-content"
                    th:text="${comment.content}"
                  ></div>

                  <!-- 대댓글 작성 폼 -->
                  <div
                    th:if="${comment.parent == null}"
                    th:id="'reply-form-' + ${comment.id}"
                    class="mt-3 bg-white p-3 rounded-3 border"
                    style="display: none"
                  >
                    <form
                      th:action="@{/web/posts/{id}/comments(id=${post.id})}"
                      method="post"
                    >
                      <input
                        type="hidden"
                        name="parentId"
                        th:value="${comment.id}"
                      />
                      <div class="mb-2">
                        <textarea
                          name="content"
                          class="form-control form-control-sm"
                          rows="2"
                          placeholder="답글을 남겨주세요..."
                          required
                        ></textarea>
                      </div>
                      <div class="d-flex gap-2 justify-content-end">
                        <button
                          type="button"
                          class="btn btn-sm btn-light"
                          th:onclick="'toggleReplyForm(' + ${comment.id} + ')'"
                        >
                          취소
                        </button>
                        <button type="submit" class="btn btn-sm btn-primary">
                          답글 등록
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      function toggleReplyForm(commentId) {
        const replyForm = document.getElementById("reply-form-" + commentId);
        if (replyForm.style.display === "none") {
          replyForm.style.display = "block";
        } else {
          replyForm.style.display = "none";
        }
      }
    </script>
  </body>
</html>
