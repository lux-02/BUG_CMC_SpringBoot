spring.application.name=board

# MySQL 데이터베이스 설정
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/board_v2?serverTimezone=Asia/Seoul&createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
# 비밀번호가 있다면 아래에 입력하세요.
spring.datasource.password=

# JPA / Hibernate 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# MySQL 전용 Dialect 설정 (버전에 맞게 Hibernate가 자동 선택하지만 명시적으로 지정)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
